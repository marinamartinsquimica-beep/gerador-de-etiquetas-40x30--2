name: Publicar gerador limpo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter site do próprio repositório
        uses: actions/checkout@v4
      - name: Preparar site
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f ! -name 'README.md' ! -name '.pages-trigger' -exec cp {} _site/ \;
          [ -d vendor ] && cp -R vendor _site/ || true
          [ -d icons ] && cp -R icons _site/ || true
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
